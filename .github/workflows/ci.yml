name: CI MyBank

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dependances
        run: npm ci
        working-directory: frontend

      - name: Build React
        run: npm run build
        working-directory: frontend

      - name: Lint ESLint
        run: npm run lint
        working-directory: frontend

      - name: Tests Vitest
        run: npm run test -- --run
        working-directory: frontend

  backend-tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mybank_test
          MYSQL_USER: mybank
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: rootsecret
        ports:
          - "3306:3306"
        options: --health-cmd='mysqladmin ping' --health-interval=10s --health-retries=5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql

      - name: Installation des dépendances Composer
        run: composer update --no-interaction --prefer-dist
        working-directory: backend/skeleton

      - name: Créer la base de test + migrations
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
        working-directory: backend/skeleton
        env:
          DATABASE_URL: "mysql://mybank:secret@127.0.0.1:3306/mybank_test"

      - name: Tests PHPUnit
        run: php bin/phpunit --testdox
        working-directory: backend/skeleton
        env:
          DATABASE_URL: "mysql://mybank:secret@127.0.0.1:3306/mybank_test"