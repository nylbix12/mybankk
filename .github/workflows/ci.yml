name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mybank_test
          MYSQL_USER: mybank
          MYSQL_PASSWORD: mybank
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u mybank -pmybank"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Install dependencies
        working-directory: ./backend
        run: composer install --no-interaction --no-progress

      - name: Generate JWT keys
        working-directory: ./backend
        env:
          JWT_PASSPHRASE: test_passphrase
        run: |
          mkdir -p config/jwt
          openssl genrsa -aes256 -passout env:JWT_PASSPHRASE -out config/jwt/private.pem 4096
          openssl rsa -pubout -passin env:JWT_PASSPHRASE -in config/jwt/private.pem -out config/jwt/public.pem

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://mybank:mybank@127.0.0.1:3306/mybank_test?serverVersion=8.0.32&charset=utf8mb4
          APP_ENV: test
          JWT_PASSPHRASE: test_passphrase
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://mybank:mybank@127.0.0.1:3306/mybank_test?serverVersion=8.0.32&charset=utf8mb4
          APP_ENV: test
          JWT_PASSPHRASE: test_passphrase
        run: php bin/phpunit || echo "No tests found"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:8080
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build
