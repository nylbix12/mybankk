# .github/dependabot.yml
version: 2
updates:
# Frontend npm
- package-ecosystem: "npm"
directory: "/frontend"
schedule:
interval: "weekly"
open-pull-requests-limit: 5
# Backend Composer 
- package-ecosystem: "composer"
directory: "/backend"
schedule:
interval: "weekly"
# GitHub Actions
- package-ecosystem: "github-actions"
directory: "/"
schedule:
interval: "monthly"
# Docker
- package-ecosystem: "docker"
directory: "/backend"
schedule:
interval: "monthly"