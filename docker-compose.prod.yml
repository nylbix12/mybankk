services:
  frontend:
    image: ghcr.io/nylbix12/mybank-frontend:latest
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - mybank-net

  backend:
    image: ghcr.io/nylbix12/mybank-backend:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mybank-net

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: mybank
      MYSQL_USER: mybank
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - mybank-net

volumes:
  db-data:

networks:
  mybank-net:
